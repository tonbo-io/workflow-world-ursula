apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-capacity-runner
  namespace: workflow-benchmark-postgres
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-capacity-runner
    spec:
      restartPolicy: Never
      nodeSelector:
        workflow-benchmark-role: app
      initContainers:
        - name: fetch-rds-ca
          image: public.ecr.aws/docker/library/alpine:3.22
          command: [/bin/sh, -ec]
          args:
            - wget -qO /rds-ca/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /rds-ca
        - name: wait-for-app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          command: [node, --input-type=module, -e]
          args:
            - |
              const url = "http://workflow-benchmark-app.workflow-benchmark-postgres.svc.cluster.local:3000/api/health";
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (;;) {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                await wait(1_000);
              }
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          command: [/bin/sh, -c]
          args:
            - |
              pnpm --filter workflow-benchmark-runner benchmark
              status=$?
              if [ -f "$BENCH_OUTPUT_FILE" ]; then
                printf 'BENCH_RESULT_BASE64='
                base64 -w 0 "$BENCH_OUTPUT_FILE"
                printf '\n'
              fi
              exit "$status"
          env:
            - name: DEPLOYMENT_URL
              value: http://workflow-benchmark-app.workflow-benchmark-postgres.svc.cluster.local:3000
            - name: APP_NAME
              value: eks-nextjs
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-postgres-benchmark
                  key: url
            - name: WORKFLOW_BENCH_BACKEND
              value: postgres-rds-multi-az
            - name: WORKFLOW_BENCH_PROFILE_URL
              value: http://workflow-benchmark-app-headless.workflow-benchmark-postgres.svc.cluster.local:3000/api/bench/profile
            - name: BENCH_CAPACITY_ONLY
              value: "1"
            - name: BENCH_CAPACITY_RUN_COUNTS
              value: "25,50,100,250,500"
            - name: BENCH_CAPACITY_STEP_COUNT
              value: "20"
            - name: BENCH_CAPACITY_ITERATIONS
              value: "1"
            - name: BENCH_CAPACITY_QUEUE_SHARDS
              value: "8"
            - name: BENCH_RUN_TIMEOUT_MS
              value: "600000"
            - name: BENCH_OUTPUT_FILE
              value: /results/capacity-results-eks-nextjs-postgres.json
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
      volumes:
        - name: results
          emptyDir: {}
        - name: rds-ca
          emptyDir: {}
