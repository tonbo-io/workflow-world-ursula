apiVersion: v1
kind: Namespace
metadata:
  name: workflow-benchmark
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-world-storage-ursula
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-world-storage-ursula
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
        workflow-benchmark-role: app
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command: [/bin/sh, -ec]
          args:
            - |
              pnpm --filter workflow-benchmark-runner benchmark:world-storage
              printf 'WORLD_STORAGE_RESULT_BASE64='
              base64 -w 0 "$WORLD_STORAGE_OUTPUT_FILE"
              printf '\n'
          env:
            - name: WORKFLOW_BENCH_BACKEND
              value: ursula-world-storage
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-world-storage-benchmark
            - name: WORLD_STORAGE_CONCURRENT_RUNS
              value: "1,8,32,128"
            - name: WORLD_STORAGE_STEPS_PER_RUN
              value: "50"
            - name: WORLD_STORAGE_ITERATIONS
              value: "3"
            - name: WORLD_STORAGE_OUTPUT_FILE
              value: /results/world-storage-ursula.json
            - name: WORKFLOW_URSULA_METRICS_URLS
              value: >-
                http://ursula-0.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-1.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-2.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics
            - name: WORKFLOW_URSULA_GATEWAY_METRICS_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437/__ursula/gateway/metrics
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
