apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-queue-remote-worker
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-queue-cross-instance
        role: worker
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { createQueue, UrsulaClient } from '@tonbo-io/world-ursula';
              const client = new UrsulaClient({
                baseUrl: process.env.WORKFLOW_URSULA_URL,
                bucket: process.env.WORKFLOW_URSULA_BUCKET,
              });
              const queue = createQueue(client, {
                pollIntervalMs: 10_000,
                longPollTimeoutMs: 25_000,
              });
              let resolveDelivery;
              const delivered = new Promise((resolve) => {
                resolveDelivery = resolve;
              });
              queue.createQueueHandler('__wkf_workflow_', async (message) => {
                console.log(`CROSS_INSTANCE_DELIVERED=${JSON.stringify(message)}`);
                resolveDelivery();
              });
              await queue.start();
              await Promise.race([
                delivered,
                new Promise((_, reject) =>
                  setTimeout(() => reject(new Error('cross-instance delivery timed out')), 60_000)
                ),
              ]);
              await queue.close();
          env:
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-cross-instance-queue
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-queue-remote-producer
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-queue-cross-instance
        role: producer
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: workflow-queue-cross-instance
                  role: worker
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: let-worker-attach
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - sh
            - -c
            - sleep 5
      containers:
        - name: producer
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command:
            - node
            - --input-type=module
            - -e
            - |
              import { createQueue, UrsulaClient } from '@tonbo-io/world-ursula';
              const client = new UrsulaClient({
                baseUrl: process.env.WORKFLOW_URSULA_URL,
                bucket: process.env.WORKFLOW_URSULA_BUCKET,
              });
              const queue = createQueue(client, { pollIntervalMs: 10_000 });
              const marker = `remote-${Date.now()}`;
              const result = await queue.queue(
                '__wkf_workflow_cross_instance',
                { runId: marker },
                { idempotencyKey: marker }
              );
              console.log(`CROSS_INSTANCE_ENQUEUED=${result.messageId}`);
              await queue.close();
          env:
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-cross-instance-queue
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
