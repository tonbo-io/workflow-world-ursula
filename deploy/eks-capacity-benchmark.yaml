apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-capacity-runner
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-capacity-runner
    spec:
      restartPolicy: Never
      nodeSelector:
        workflow-benchmark-role: app
      initContainers:
        - name: wait-for-app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command: [node, --input-type=module, -e]
          args:
            - |
              const url = "http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000/api/health";
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (;;) {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                await wait(1_000);
              }
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command: [/bin/sh, -c]
          args:
            - |
              pnpm --filter workflow-benchmark-runner benchmark
              status=$?
              if [ -f "$BENCH_OUTPUT_FILE" ]; then
                printf 'BENCH_RESULT_BASE64='
                base64 -w 0 "$BENCH_OUTPUT_FILE"
                printf '\n'
              fi
              exit "$status"
          env:
            - name: DEPLOYMENT_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: APP_NAME
              value: eks-nextjs
            - name: WORKFLOW_URSULA_METRICS_URLS
              value: >-
                http://ursula-0.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-1.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-2.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics
            - name: WORKFLOW_URSULA_GATEWAY_METRICS_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437/__ursula/gateway/metrics
            - name: WORKFLOW_BENCH_BACKEND
              value: ursula-eks
            - name: BENCH_CAPACITY_ONLY
              value: "1"
            - name: BENCH_CAPACITY_RUN_COUNTS
              value: "25,50,100,250,500,1000"
            - name: BENCH_CAPACITY_STEP_COUNT
              value: "20"
            - name: BENCH_CAPACITY_ITERATIONS
              value: "1"
            - name: BENCH_CAPACITY_QUEUE_SHARDS
              value: "8"
            - name: BENCH_RUN_TIMEOUT_MS
              value: "600000"
            - name: BENCH_OUTPUT_FILE
              value: /results/capacity-results-eks-nextjs-ursula.json
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
