apiVersion: v1
kind: Namespace
metadata:
  name: workflow-benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark
spec:
  replicas: 4
  selector:
    matchLabels:
      app: workflow-benchmark-app
  template:
    metadata:
      labels:
        app: workflow-benchmark-app
    spec:
      nodeSelector:
        workflow-benchmark-role: app
      containers:
        - name: app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          env:
            - name: WORKFLOW_TARGET_WORLD
              value: "@tonbo-io/world-ursula"
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-benchmark-round3-v037-final2
            - name: WORKFLOW_URSULA_DEPLOYMENT_ID
              value: eks-us-east-1
            - name: WORKFLOW_URSULA_QUEUE_DELIVERY_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: WORKFLOW_URSULA_EXPERIMENTAL_OWNED_STEP_TRANSACTIONS
              value: "1"
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "600m"
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark
spec:
  selector:
    app: workflow-benchmark-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-benchmark-runner
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-benchmark-runner
    spec:
      restartPolicy: Never
      nodeSelector:
        workflow-benchmark-role: app
      initContainers:
        - name: wait-for-app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command:
            - node
            - --input-type=module
            - -e
            - |
              const url = "http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000/api/health";
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (;;) {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                await wait(1_000);
              }
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-ursula
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              pnpm --filter workflow-benchmark-runner benchmark
              status=$?
              if [ -f "$BENCH_OUTPUT_FILE" ]; then
                printf 'BENCH_RESULT_BASE64='
                base64 -w 0 "$BENCH_OUTPUT_FILE"
                printf '\n'
              fi
              exit "$status"
          env:
            - name: DEPLOYMENT_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: APP_NAME
              value: eks-nextjs
            - name: WORKFLOW_TARGET_WORLD
              value: "@tonbo-io/world-ursula"
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-benchmark-round3-v037-final2
            - name: WORKFLOW_URSULA_DEPLOYMENT_ID
              value: eks-us-east-1-runner
            - name: WORKFLOW_URSULA_QUEUE_DELIVERY_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: WORKFLOW_URSULA_METRICS_URLS
              value: >-
                http://ursula-0.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-1.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics,
                http://ursula-2.ursula-headless.ursula.svc.cluster.local:4437/__ursula/metrics
            - name: WORKFLOW_URSULA_GATEWAY_METRICS_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437/__ursula/gateway/metrics
            - name: WORKFLOW_BENCH_BACKEND
              value: ursula-eks
            - name: BENCH_OUTPUT_FILE
              value: /results/bench-results-eks-nextjs-ursula.json
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
