apiVersion: v1
kind: Namespace
metadata:
  name: workflow-benchmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workflow-benchmark-app
  template:
    metadata:
      labels:
        app: workflow-benchmark-app
    spec:
      containers:
        - name: app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main
          imagePullPolicy: Always
          env:
            - name: WORKFLOW_TARGET_WORLD
              value: "@tonbo-io/world-ursula"
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-benchmark-official-20260725
            - name: WORKFLOW_URSULA_DEPLOYMENT_ID
              value: eks-us-east-1
            - name: WORKFLOW_URSULA_QUEUE_DELIVERY_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark
spec:
  selector:
    app: workflow-benchmark-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-benchmark-runner
  namespace: workflow-benchmark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-benchmark-runner
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main
          imagePullPolicy: Always
          command:
            - node
            - --input-type=module
            - -e
            - |
              const url = "http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000/api/health";
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (;;) {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                await wait(1_000);
              }
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main
          imagePullPolicy: Always
          command:
            - pnpm
            - --filter
            - workflow-benchmark-runner
            - benchmark
          env:
            - name: DEPLOYMENT_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: APP_NAME
              value: eks-nextjs
            - name: WORKFLOW_TARGET_WORLD
              value: "@tonbo-io/world-ursula"
            - name: WORKFLOW_URSULA_URL
              value: http://ursula-gateway.ursula.svc.cluster.local:4437
            - name: WORKFLOW_URSULA_BUCKET
              value: workflow-benchmark-official-20260725
            - name: WORKFLOW_URSULA_DEPLOYMENT_ID
              value: eks-us-east-1-runner
            - name: WORKFLOW_URSULA_QUEUE_DELIVERY_URL
              value: http://workflow-benchmark-app.workflow-benchmark.svc.cluster.local:3000
            - name: WORKFLOW_BENCH_BACKEND
              value: ursula-eks
            - name: BENCH_OUTPUT_FILE
              value: /results/bench-results-eks-nextjs-ursula.json
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          emptyDir: {}
