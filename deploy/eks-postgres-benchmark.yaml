apiVersion: v1
kind: Namespace
metadata:
  name: workflow-benchmark-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark-postgres
spec:
  replicas: 4
  selector:
    matchLabels:
      app: workflow-benchmark-app
  template:
    metadata:
      labels:
        app: workflow-benchmark-app
    spec:
      nodeSelector:
        workflow-benchmark-role: app
      initContainers:
        - name: fetch-rds-ca
          image: public.ecr.aws/docker/library/alpine:3.22
          command:
            - /bin/sh
            - -ec
          args:
            - wget -qO /rds-ca/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /rds-ca
        - name: bootstrap-postgres
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          command:
            - /workspace/benchmark/app/node_modules/.bin/bootstrap
          env:
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-postgres-benchmark
                  key: url
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          env:
            - name: WORKFLOW_TARGET_WORLD
              value: "@workflow/world-postgres"
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-postgres-benchmark
                  key: url
            - name: WORKFLOW_POSTGRES_JOB_PREFIX
              value: eks-benchmark
            - name: WORKFLOW_POSTGRES_WORKER_CONCURRENCY
              value: "64"
            - name: WORKFLOW_POSTGRES_MAX_POOL_SIZE
              value: "66"
            - name: PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: "600m"
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
      volumes:
        - name: rds-ca
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-benchmark-app
  namespace: workflow-benchmark-postgres
spec:
  selector:
    app: workflow-benchmark-app
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workflow-benchmark-runner
  namespace: workflow-benchmark-postgres
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: workflow-benchmark-runner
    spec:
      restartPolicy: Never
      nodeSelector:
        workflow-benchmark-role: app
      initContainers:
        - name: fetch-rds-ca
          image: public.ecr.aws/docker/library/alpine:3.22
          command:
            - /bin/sh
            - -ec
          args:
            - wget -qO /rds-ca/global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
          volumeMounts:
            - name: rds-ca
              mountPath: /rds-ca
        - name: wait-for-app
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          command:
            - node
            - --input-type=module
            - -e
            - |
              const url = "http://workflow-benchmark-app.workflow-benchmark-postgres.svc.cluster.local:3000/api/health";
              const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              for (;;) {
                try {
                  const response = await fetch(url);
                  if (response.ok) process.exit(0);
                } catch {}
                await wait(1_000);
              }
      containers:
        - name: runner
          image: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-postgres
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
          args:
            - |
              pnpm --filter workflow-benchmark-runner benchmark
              status=$?
              if [ -f "$BENCH_OUTPUT_FILE" ]; then
                printf 'BENCH_RESULT_BASE64='
                base64 -w 0 "$BENCH_OUTPUT_FILE"
                printf '\n'
              fi
              exit "$status"
          env:
            - name: DEPLOYMENT_URL
              value: http://workflow-benchmark-app.workflow-benchmark-postgres.svc.cluster.local:3000
            - name: APP_NAME
              value: eks-nextjs
            - name: WORKFLOW_TARGET_WORLD
              value: "@workflow/world-postgres"
            - name: WORKFLOW_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: workflow-postgres-benchmark
                  key: url
            - name: WORKFLOW_BENCH_BACKEND
              value: postgres-rds-multi-az
            - name: BENCH_OUTPUT_FILE
              value: /results/bench-results-eks-nextjs-postgres.json
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: results
              mountPath: /results
            - name: rds-ca
              mountPath: /etc/ssl/rds
              readOnly: true
      volumes:
        - name: results
          emptyDir: {}
        - name: rds-ca
          emptyDir: {}
