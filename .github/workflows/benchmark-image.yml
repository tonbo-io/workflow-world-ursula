name: Benchmark image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - benchmark/**
      - src/**
      - Dockerfile.benchmark
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  push:
    branches:
      - main
    paths:
      - benchmark/**
      - src/**
      - Dockerfile.benchmark
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: ursula
            world: "@tonbo-io/world-ursula"
          - name: postgres
            world: "@workflow/world-postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: depot/setup-action@v1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: depot/build-push-action@v1
        with:
          project: ls2d88cjpz
          context: .
          file: Dockerfile.benchmark
          build-args: |
            BENCHMARK_WORLD=${{ matrix.world }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/tonbo-io/workflow-world-ursula-benchmark:main-${{ matrix.name }}
